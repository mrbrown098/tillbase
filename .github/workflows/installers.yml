name: Installers

# Reusable workflow (called by ci.yml and release.yml). Builds the installer for each operating
# system and CPU on a runner of that same kind, then INSTALLS it and smoke-tests the installed app:
# first-run setup screen, owner creation, Checkout tab, no console errors, database in the normal
# per-user app-data folder.
#
#   Windows x64   NSIS setup .exe, installed silently, then launched
#   macOS arm64   dmg, mounted, app copied out, then launched   (macos-latest, Apple Silicon)
#   macOS x64     dmg, mounted, app copied out, then launched   (macos-15-intel, Intel)
#   Linux x64     AppImage run as a file; .deb installed with apt-get, then launched
on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { id: windows-x64, name: Windows x64, os: windows-latest, builder: "--win --x64" }
          - { id: macos-arm64, name: macOS arm64, os: macos-latest, builder: "--mac --arm64" }
          - { id: macos-x64, name: macOS x64, os: macos-15-intel, builder: "--mac --x64" }
          - { id: linux-x64, name: Linux x64, os: ubuntu-latest, builder: "--linux --x64" }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build -w @tillbase/core
      # Builds the app, then electron-builder rebuilds / downloads SQLite for this Electron version,
      # operating system and CPU and unpacks it from the asar archive.
      - name: Build installers
        run: npm run dist -w @tillbase/desktop -- ${{ matrix.builder }}
        env:
          # No certificates exist yet; never let electron-builder go looking for one.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: List what was built
        run: ls -la packages/desktop/release
      - name: Check the SQLite binary matches this OS and CPU
        run: node scripts/verify-native.mjs

      - name: Install and smoke-test (Windows)
        if: runner.os == 'Windows'
        run: node scripts/smoke-installer.mjs windows --shots smoke-output/installer
      - name: Install and smoke-test (macOS)
        if: runner.os == 'macOS'
        run: node scripts/smoke-installer.mjs mac --shots smoke-output/installer
      - name: Install a virtual display (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
      - name: Install and smoke-test the AppImage (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a node scripts/smoke-installer.mjs appimage --shots smoke-output/appimage
      - name: Install and smoke-test the .deb (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a node scripts/smoke-installer.mjs deb --shots smoke-output/deb

      - name: Save screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: installer-smoke-${{ matrix.id }}
          path: smoke-output/
          if-no-files-found: warn
          retention-days: 14

      # Only reached when every check above passed, so an installer that fails its smoke test is
      # never uploaded and can never be attached to a release.
      - name: Save installers
        uses: actions/upload-artifact@v7
        with:
          name: installers-${{ matrix.id }}
          path: |
            packages/desktop/release/Tillbase-*
            !packages/desktop/release/**/*.blockmap
          if-no-files-found: error
          retention-days: 14
