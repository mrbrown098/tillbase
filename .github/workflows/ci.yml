name: CI

# Runs on every pull request and on every push to main.
#   test       typecheck and unit tests on Linux, Windows and macOS
#   smoke      builds the app and launches it for real on Linux, Windows and macOS
#   installers builds the installers on every OS and tests the INSTALLED app (see installers.yml)
#   lockfile   package-lock.json must not fetch anything over git
#   fresh-clone what a new contributor does on a new machine, with the NEWEST npm
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lockfile:
    name: Lockfile has no git dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # npm 11 refuses git dependencies (EALLOWGIT), and a git+ssh URL fails for anyone without a GitHub SSH key.
      - run: node scripts/check-lockfile.mjs

  # A real person cloning the repository on a new machine hit two bugs that every other job here missed,
  # because those jobs run with a warm cache and a pinned npm: npm 11 refusing a git dependency, and npm
  # 11.2x blocking install scripts so Electron never downloaded. This job is that person: a clean checkout,
  # no dependency cache, the newest npm, then the same steps README.md tells them to run.
  fresh-clone:
    name: Fresh clone (${{ matrix.os }}, Node ${{ matrix.node }}, newest npm)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          # No `cache: npm`: a fresh machine has nothing cached.
      - name: Install the newest npm
        run: npm install -g npm@latest
      - name: Show the versions in use
        shell: bash
        run: |
          echo "node $(node --version)"
          echo "npm  $(npm --version)"
          npm config get ignore-scripts
      - name: Lockfile has no git dependencies
        run: node scripts/check-lockfile.mjs
      - run: npm ci
      - name: Electron was downloaded (npm may have blocked its install script)
        run: node scripts/check-electron-installed.mjs
      - run: npm run build -w @tillbase/core
      - run: npm run rebuild -w @tillbase/desktop
      - run: npm run build -w @tillbase/desktop
      - name: Install a virtual display (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
      - name: App smoke test (Linux, virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run -a node scripts/smoke.mjs --dev --shots smoke-output
      - name: App smoke test
        if: runner.os != 'Linux'
        run: node scripts/smoke.mjs --dev --shots smoke-output
      - name: Reports and A4 PDFs end to end (real app, checks the numbers against the database)
        run: node scripts/e2e-reports.mjs --shots smoke-output
      - name: Save screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fresh-clone-screenshots-${{ runner.os }}-node${{ matrix.node }}
          path: smoke-output/
          if-no-files-found: warn
          retention-days: 7

  test:
    name: Test (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # better-sqlite3 12.10+ ships no prebuilt binaries for Node 20 (end of life), so Windows
          # cannot install on it without a C++ compiler. Node 22 is the minimum we support.
          - { os: ubuntu-latest, node: 22 }
          - { os: ubuntu-latest, node: 24 }
          - { os: windows-latest, node: 22 }
          - { os: macos-latest, node: 22 }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # The tests run in plain Node, which needs a different build of SQLite than Electron does.
      - run: npm run rebuild:node
      # `typecheck` and `test` first build @tillbase/core (root pretypecheck / pretest scripts),
      # because @tillbase/desktop imports the compiled package.
      - run: npm run typecheck
      - run: npm test

  smoke:
    name: App smoke test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build -w @tillbase/core
      # Prepare SQLite for Electron (prebuilt binary first, compile only if that fails).
      - run: npm run rebuild -w @tillbase/desktop
      - run: npm run build -w @tillbase/desktop
      - name: Install a virtual display (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
      - name: Launch the app and walk through first-run setup (Linux, virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run -a node scripts/smoke.mjs --dev --shots smoke-output
      - name: Launch the app and walk through first-run setup
        if: runner.os != 'Linux'
        run: node scripts/smoke.mjs --dev --shots smoke-output
      - name: Supplier orders end to end (real app, checks the database)
        run: node scripts/e2e-purchase-orders.mjs --shots smoke-output
      - name: Save screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-screenshots-${{ runner.os }}
          path: smoke-output/
          if-no-files-found: warn
          retention-days: 14

  installers:
    name: Installers
    uses: ./.github/workflows/installers.yml
